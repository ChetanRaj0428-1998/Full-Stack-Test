spring.application.name=todo-api


# Let the platform pick the port (fallback 8080 for local dev)
server.port=${PORT:8080}

# Use H2 in-memory DB for a quick demo (data resets on restart)
spring.datasource.url=jdbc:h2:mem:todo;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
